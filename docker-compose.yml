services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: laravel-cars-parser-app
        container_name: cars-parser-app
        restart: unless-stopped
        tty: true
        environment:
            SERVICE_NAME: app
        volumes:
            - .:/var/www
        networks:
            - cars-parser-network

    nginx:
        image: nginx:alpine
        container_name: cars-parser-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
            - ./nginx.conf:/etc/nginx/conf.d/default.conf

        networks:
            - cars-parser-network
        depends_on:
            - app

    db:
        image: mysql:8.0
        container_name: cars-parser-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
        ports:
            - "3306:3306"
        volumes:
            - dbdata:/var/lib/mysql
        networks:
            - cars-parser-network

networks:
    cars-parser-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
